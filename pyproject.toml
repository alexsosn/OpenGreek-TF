[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opengreek-tf"
version = "0.1.0.dev0"
description = "Materialize the Open Greek Corpus as native Text-Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Oleksandr (Alex) Sosnovshchenko" },
]
dependencies = [
  "text-fabric>=13.1,<14",
]

[project.scripts]
opengreek-tf = "opengreek_tf.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/alexsosn/OpenGreek-TF"
Issues = "https://github.com/alexsosn/OpenGreek-TF/issues"
Upstream = "https://github.com/open-greek/open-greek-corpus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
