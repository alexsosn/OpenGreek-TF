name: Pinned locus collision probe

on:
  pull_request:
    paths:
      - "src/opengreek_tf/locus_probe.py"
      - "tests/test_locus_probe.py"
      - "docs/research/locus-collisions.md"
      - ".github/workflows/locus-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Fetch the exact pinned release (selected files only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init --quiet
          git -C upstream remote add origin https://github.com/open-greek/open-greek-corpus.git
          git -C upstream sparse-checkout init --no-cone
          cat > upstream/.git/info/sparse-checkout <<'EOF'
          /data/corpus_release.json
          /data/corpus/proclus.in-platonis-timaeum-commentaria.jsonl
          /data/corpus/apollodorus-atheniensis.fragmenta.jsonl
          /data/corpus/heraclides-ponticus.fragmenta.jsonl
          /data/corpus_secondary/heraclides-ponticus.fragmenta-fhg2.jsonl
          EOF
          git -C upstream fetch --depth 1 --filter=blob:none origin \
            338aa27310b3cfe2588a993b4d113b503597d70f
          git -C upstream checkout --detach FETCH_HEAD
      - name: Verify pinned source identity
        run: opengreek-tf verify-source upstream
      - name: Classify source-locus groups
        shell: python
        run: |
          import json
          from pathlib import Path
          from opengreek_tf.locus_probe import analyze_loci

          sources = [
              "data/corpus/proclus.in-platonis-timaeum-commentaria.jsonl",
              "data/corpus/apollodorus-atheniensis.fragmenta.jsonl",
              "data/corpus/heraclides-ponticus.fragmenta.jsonl",
              "data/corpus_secondary/heraclides-ponticus.fragmenta-fhg2.jsonl",
          ]
          report = {
              "upstream_revision": "338aa27310b3cfe2588a993b4d113b503597d70f",
              "files": {
                  source: analyze_loci(Path("upstream") / source, max_groups=10)
                  for source in sources
              },
          }
          Path("locus-collisions.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          compact = {
              p: {
                  k: v
                  for k, v in details.items()
                  if k != "top_groups"
              }
              for p, details in report["files"].items()
          }
          print(json.dumps(compact, sort_keys=True))
      - uses: actions/upload-artifact@v4
        with:
          name: locus-collisions
          path: locus-collisions.json
          if-no-files-found: error
