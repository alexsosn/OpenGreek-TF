name: Pinned November 2026 Open Greek source identity

on:
  pull_request:
    paths:
      - "src/opengreek_tf/release.py"
      - "src/opengreek_tf/source.py"
      - "src/opengreek_tf/cli.py"
      - "tests/test_new_release_manifest.py"
      - ".github/workflows/november-source-pin.yml"
      - "docs/research/november-source-migration.md"
      - "src/opengreek_tf/record_stream.py"
      - "src/opengreek_tf/text_materializer.py"
      - "src/opengreek_tf/unaligned_materializer.py"
      - "src/opengreek_tf/jsonl_conservation.py"
      - "tests/test_record_stream.py"
      - "tests/test_november_text_schema.py"
      - "src/opengreek_tf/native_composer.py"
      - "tests/test_native_cr_source_facts.py"
      - "tests/test_november_secondary_complete.py"
      - "tests/test_november_primary_complete.py"
      - "tests/test_november_schema_census.py"
      - "src/opengreek_tf/fact_graph.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  immutable-november-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI
        run: python -m pip install -e .
      - name: Acquire exact November publishing commit (not annotated tag object)
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet new-source
          git -C new-source remote add origin https://github.com/open-greek/open-greek-corpus.git
          git -C new-source sparse-checkout init --no-cone
          printf '%s\n' \
            '/data/corpus_release.json' \
            '/data/public_export.json' \
            '/data/corpus/' \
            '/data/corpus_secondary/' \
            '/data/paratext/' \
            '/data/corpus_changes/dioscorides-pedanius.de-materia-medica.printed-divisions.json' \
            > new-source/.git/info/sparse-checkout
          git -C new-source fetch --depth 1 --filter=blob:none origin \
            122f2cba907dbac0af63f75cf1a54fa3309f36ba
          git -C new-source checkout --detach --force FETCH_HEAD
          test "$(git -C new-source rev-parse HEAD)" = \
            122f2cba907dbac0af63f75cf1a54fa3309f36ba
      - name: Verify release manifest, independent export and Dioscorides evidence
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from opengreek_tf.release import NOVEMBER_RELEASE, SUPPORTED_RELEASE
          from opengreek_tf.source import SourceAcquisitionError, verify_source

          root = Path("new-source")
          verified = verify_source(root, identity=NOVEMBER_RELEASE)
          assert verified.revision == NOVEMBER_RELEASE.commit
          try:
              verify_source(root, identity=SUPPORTED_RELEASE)
          except SourceAcquisitionError:
              pass
          else:
              raise AssertionError("September source verifier accepted November release")

          manifest = json.loads((root / "data/corpus_release.json").read_text(
              encoding="utf-8"))
          export = json.loads((root / "data/public_export.json").read_text(
              encoding="utf-8"))
          assert manifest["pin"]["manifest"] == "data/public_export.json"
          assert export["corpus_sha256"] == manifest["pin"]["corpus_sha256"]
          assert export["release_id"] == NOVEMBER_RELEASE.release_id
          assert len(export["files"]) == NOVEMBER_RELEASE.works
          assert manifest["corpus"]["passages"] == NOVEMBER_RELEASE.passages

          change = json.loads((root / "data/corpus_changes/dioscorides-pedanius.de-materia-medica.printed-divisions.json").read_text(
              encoding="utf-8"))
          assert change["source_urn"] == "dioscorides-pedanius.de-materia-medica"
          assert len(change["locus_map"]) == 6
          assert len(change["withdrawn"]) == 5
          assert set(change["locus_map"]).isdisjoint(change["withdrawn"])
          assert all(key and dest.startswith(change["source_urn"] + ":")
                     for key, dest in change["locus_map"].items())
          stdout = subprocess.check_output([
              "opengreek-tf", "verify-source", str(root), "--release",
              "corpus-2026-11-17",
          ], text=True)
          assert json.loads(stdout)["revision"] == NOVEMBER_RELEASE.commit
          print(json.dumps({
              "source_identity": "PASS",
              "revision": verified.revision,
              "release_id": NOVEMBER_RELEASE.release_id,
              "release_manifest_schema": "public-export",
              "works": NOVEMBER_RELEASE.works,
              "passages": NOVEMBER_RELEASE.passages,
              "corpus_sha256": export["corpus_sha256"],
              "dioscorides_locus_redirects": len(change["locus_map"]),
              "dioscorides_withdrawn": len(change["withdrawn"]),
              "native_tf_migration_complete": False,
          }, sort_keys=True))

      - name: Audit ALL actual November original text-family schemas, nested paths and CR
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import json
          from opengreek_tf.source import verify_source
          from opengreek_tf.release import NOVEMBER_RELEASE

          root = Path("new-source")
          assert verify_source(root, identity=NOVEMBER_RELEASE)
          def kind(x):
              if x is None:
                  return "null"
              if type(x) is bool:
                  return "bool"
              return type(x).__name__
          # Literal keys are path segments; None denotes an array element.
          # Dots, brackets and namespace URIs in source keys cannot collide.
          def scan(value, path, nested, nested_examples, cr, example):
              value_type = kind(value)
              if type(value) is dict:
                  key = ("object", path, tuple(sorted(value)))
              elif type(value) is list:
                  key = ("array", path, tuple(sorted({kind(item) for item in value})))
              else:
                  key = ("scalar", path, value_type)
              nested[key] += 1
              nested_examples.setdefault(key, example)
              if type(value) is dict:
                  for k, v in value.items():
                      scan(v, path + (k,), nested, nested_examples, cr, example)
              elif type(value) is list:
                  for item in value:
                      scan(item, path + (None,), nested, nested_examples, cr, example)
              elif type(value) is str and "\r" in value:
                  cr[path] += value.count("\r")

          def json_order(value):
              return json.dumps(value, ensure_ascii=True, sort_keys=True)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate source key {key!r}")
                  result[key] = value
              return result

          report = {}
          for family, dirname, expected, expected_rows in (
              ("primary", "corpus", 3939, 1913683),
              ("secondary", "corpus_secondary", 560, 338245),
              ("paratext", "paratext", 17, 23969),
          ):
              paths = sorted((root / "data" / dirname).rglob("*.jsonl"))
              assert len(paths) == expected, (family, len(paths), expected)
              field_types = Counter()
              field_examples = {}
              variants = Counter()
              variant_examples = {}
              nested = Counter()
              nested_examples = {}
              cr = Counter()
              rows = 0
              files_with_rows = 0
              for path in paths:
                  file_rows = 0
                  relative = path.relative_to(root).as_posix()
                  with path.open("rb") as source:
                      for lineno, raw in enumerate(source, 1):
                          try:
                              line = raw.decode("utf-8", errors="strict")
                          except UnicodeDecodeError as exc:
                              raise ValueError(f"{relative}:{lineno}: invalid UTF-8") from exc
                          try:
                              obj = json.loads(line, object_pairs_hook=unique_object)
                          except ValueError as exc:
                              raise ValueError(f"{relative}:{lineno}: {exc}") from exc
                          assert type(obj) is dict, (path, lineno)
                          assert type(obj.get("text")) is str, (path, lineno)
                          rows += 1
                          file_rows += 1
                          example = {"file": relative, "line": lineno}
                          keys = tuple(sorted(obj))
                          variants[keys] += 1
                          variant_examples.setdefault(keys, example)
                          for name, value in obj.items():
                              field_key = (name, kind(value))
                              field_types[field_key] += 1
                              field_examples.setdefault(field_key, example)
                              if type(value) in (dict, list) or (type(value) is str and "\r" in value):
                                  scan(value, (name,), nested, nested_examples, cr, example)
                  files_with_rows += file_rows > 0
              assert rows == expected_rows, (family, rows, expected_rows)
              assert sum(variants.values()) == rows
              report[family] = {
                  "files": len(paths), "nonempty_files": files_with_rows,
                  "rows": rows,
                  "field_types": [
                      {"field": k, "type": t, "count": n, "example": field_examples[(k, t)]}
                      for (k, t), n in sorted(field_types.items())
                  ],
                  "row_variants": [
                      {"keys": list(keys), "count": n, "example": variant_examples[keys]}
                      for keys, n in sorted(variants.items())
                  ],
                  "nested_types": [
                      {"type": key[0], "path": list(key[1]), "shape": key[2],
                       "count": n, "example": nested_examples[key]}
                      for key, n in sorted(nested.items(), key=lambda item: json_order(item[0]))
                  ],
                  "cr_paths": [
                      {"path": list(p), "count": n}
                      for p, n in sorted(cr.items(), key=lambda item: json_order(item[0]))
                  ],
                  "nested_paratext_paths": [
                      p.relative_to(root).as_posix() for p in paths
                      if len(p.relative_to(root).parts) > 3
                  ] if family == "paratext" else [],
              }
          census_json = json.dumps(report, ensure_ascii=True, sort_keys=True)
          Path("november-source-schema-census.json").write_text(
              census_json + "\n", encoding="utf-8",
          )
          print("NOVEMBER_SOURCE_SCHEMA_CENSUS=" + census_json)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Complete pinned November source schema census\n\n")
              for family, facts in report.items():
                  f.write(f"- {family}: {facts['files']} files, {facts['rows']} original rows, "
                          f"{len(facts['field_types'])} field+type variants, "
                          f"CR paths {facts['cr_paths']}\n")

      - name: Retain exhaustive November schema census for parser research
        uses: actions/upload-artifact@v4
        with:
          name: november-source-schema-census
          path: november-source-schema-census.json
          if-no-files-found: error
          retention-days: 30

      - name: Real November primary + 65 Meibom secondary + 9 nested Gutenberg TF CLI smoke
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from opengreek_tf.jsonl_conservation import validate_native_jsonl_sources
          from opengreek_tf.native_composer import read_native_records
          from opengreek_tf.release import NOVEMBER_RELEASE

          selected = (
              "data/corpus/abas.fragmenta.jsonl",
              "data/corpus_secondary/nicomachus-mathematics.excerpta.jsonl",
              "data/paratext/gutenberg/66595.jsonl",
          )
          root = Path("new-source")
          destination = Path("real-november-selected-tf")
          command = [
              "opengreek-tf", "convert-texts", str(root),
              "--release", NOVEMBER_RELEASE.tag,
          ]
          for file in selected:
              command.extend(["--file", file])
          output = subprocess.check_output(
              [*command, "--output", str(destination)], text=True,
          )
          report = json.loads(output)
          assert report["revision"] == NOVEMBER_RELEASE.commit
          assert (report["primary_passages"], report["secondary_witnesses"],
                  report["paratext_records"]) == (1, 65, 9)
          assert report["records"] == 75
          loaded = read_native_records(destination)
          assert len(loaded) == 75
          first_meibom = loaded[1]
          assert first_meibom.fields.require("source_page").require("book") is None
          first_gutenberg = loaded[-9]
          assert first_gutenberg.source_file == selected[2]
          assert first_gutenberg.fields.require("source_sha256")
          independent = validate_native_jsonl_sources(
              root, selected, destination, identity=NOVEMBER_RELEASE,
          )
          assert independent.records == 75
          assert independent.original_source_sha256 == report["original_source_sha256"]

          print("NOVEMBER_SELECTED_REAL_TF=" + json.dumps({
              "status": "PASS", "rows": independent.records,
              "primary": 1, "secondary": 65, "nested_paratext": 9,
              "source_sha256": independent.original_source_sha256,
              "native_sha256": report["canonical_sha256"],
              "cr_containing_source_file": "CHECKED_SEPARATELY",
              "full_november_release": False,
          }, sort_keys=True))

      - name: Genuine November Gutenberg CR in mixed original native TF graph
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from tf.fabric import Fabric
          from opengreek_tf.release import NOVEMBER_RELEASE
          from opengreek_tf.native_composer import read_native_records
          from opengreek_tf.jsonl_conservation import validate_native_jsonl_sources
          from opengreek_tf.research_queries import search_native

          root = Path("new-source")
          cr_file = "data/paratext/gutenberg/32549.jsonl"
          originals = [
              json.loads(line) for line in (root / cr_file).read_bytes().splitlines()
          ]
          assert len(originals) == 30
          assert all(
              set(row) == {"locus", "text", "source", "source_sha256"}
              and type(row["text"]) is str for row in originals
          )
          assert sum(row["text"].count("\r") for row in originals) == 73
          assert sum("\r" in row["text"] for row in originals) == 25
          selected = (
              "data/corpus/abas.fragmenta.jsonl",
              "data/corpus_secondary/nicomachus-mathematics.excerpta.jsonl",
              "data/paratext/gutenberg/66595.jsonl",
              cr_file,
          )
          output_dir = Path("genuine-november-cr-mixed-native")
          cmd = [
              "opengreek-tf", "convert-texts", str(root),
              "--release", NOVEMBER_RELEASE.tag,
          ]
          for file in selected:
              cmd.extend(["--file", file])
          report = json.loads(subprocess.check_output([
              *cmd, "--output", str(output_dir),
          ], text=True))
          assert (report["primary_passages"], report["secondary_witnesses"],
                  report["paratext_records"]) == (1, 65, 39)
          assert report["records"] == 105
          independent = validate_native_jsonl_sources(
              root, selected, output_dir, identity=NOVEMBER_RELEASE,
          )
          assert independent.records == 105
          assert independent.original_source_sha256 == report["original_source_sha256"]
          recovered = read_native_records(output_dir)
          assert len(recovered) == 105
          assert [row.fields.require("text") for row in recovered[-30:]] == [
              item["text"] for item in originals
          ]
          original_cr = [
              item for item in originals if "\r" in item["text"]
          ]
          native_hits = search_native(
              output_dir, kind="paratext-record", contains="\r",
              source_file=cr_file, max_results=100,
          )
          assert [(hit.locus, hit.text) for hit in native_hits] == [
              (row["locus"], row["text"]) for row in original_cr
          ]
          cli_lines = subprocess.check_output([
              "opengreek-tf", "search-native", str(output_dir),
              "--kind", "paratext-record", "--contains", "\r",
              "--source-file", cr_file, "--max-results", "100",
          ], text=True).splitlines()
          assert [
              (item["locus"], item["text"]) for item in map(json.loads, cli_lines)
          ] == [(row["locus"], row["text"]) for row in original_cr]
          api = Fabric(locations=str(output_dir), silent="deep").load(
              "fragment_codepoint fragment_kind fragment_position fragment_text "
              "has_cr_fragment", silent="deep",
          )
          assert api
          assert sum(
              api.F.fragment_codepoint.v(node) == 13
              for node in api.F.otype.s("crFragment")
          ) == 73
          assert not api.F.otype.s("word")
          print("NOVEMBER_GENUINE_CR_NATIVE_TF=" + json.dumps({
              "status": "PASS",
              "source_release": NOVEMBER_RELEASE.release_id,
              "original_records": 105,
              "Gutenberg_32549_records": 30,
              "CR_codepoint_nodes": 73,
              "native_F_E_reconstruction": "PASS",
              "researcher_search_native_and_cli": "PASS",
              "stock_jsonl_independent_validation": "PASS",
              "source_sha256": independent.original_source_sha256,
              "native_sha256": report["canonical_sha256"],
              "primary_passage_CR_T_text_supported": False,
          }, sort_keys=True))


      - name: Independently census ALL 338245 original November secondary witness rows
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          from opengreek_tf.record_stream import FieldArray, FieldObject, parse_file
          from opengreek_tf.release import NOVEMBER_RELEASE

          root = Path("new-source")
          directory = root / "data" / "corpus_secondary"
          paths = sorted(directory.glob("*.jsonl"))
          assert len(paths) == 560
          evidence = Counter()
          records = 0
          empty = []
          source_files = set()
          for path in paths:
              relative = path.relative_to(root).as_posix()
              source_files.add(relative)
              file_rows = 0
              for row in parse_file(root, relative, identity=NOVEMBER_RELEASE):
                  assert row.occurrence_key == (relative, file_rows + 1)
                  assert row.family == "secondary"
                  assert type(row.text) is str
                  file_rows += 1
                  records += 1
                  evidence["rank"] += row.fields.get("rank") is not None
                  evidence["dubner"] += row.fields.get("dubner_source_scope") is not None
                  evidence["pindar"] += row.fields.get("pindar_duplicate_review") is not None
                  evidence["reviewed"] += row.fields.get("reviewed_duplicate_witness") is not None
                  evidence["current_target"] += row.fields.get("current_target") is not None
                  evidence["source_char_range"] += row.fields.get("source_char_range") is not None
                  page = row.fields.get("source_page")
                  if isinstance(page, FieldObject):
                      region = page.get("region")
                      if region is not None:
                          assert isinstance(region, FieldArray)
                          assert len(region.items) == 4
                          assert all(type(value) is float for value in region.items)
                          evidence["float_regions"] += 1
                          evidence["float_values"] += len(region.items)
                      else:
                          evidence["meibom_pages"] += 1
              if file_rows == 0:
                  assert path.stat().st_size == 0
                  empty.append(relative)
          assert records == 338245, records
          assert empty == ["data/corpus_secondary/democritus.fragmenta.jsonl"], empty
          assert dict(evidence) == {
              "rank": 306534,
              "dubner": 27913,
              "pindar": 6,
              "reviewed": 119,
              "current_target": 127,
              "source_char_range": 27913,
              "float_regions": 8,
              "float_values": 32,
              "meibom_pages": 4235,
          }, evidence
          print("NOVEMBER_ALL_SECONDARY_ORIGINAL_PARSER=" + json.dumps({
              "status": "PASS",
              "source_release": NOVEMBER_RELEASE.tag,
              "secondary_source_files": len(source_files),
              "secondary_original_rows": records,
              "original_empty_files": empty,
              "source_variants": dict(sorted(evidence.items())),
              "full_november_text_corpus_materialized": False,
          }, sort_keys=True))

      - name: Installed native TF conservation of genuine secondary editorial and float variants
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from tf.fabric import Fabric
          from opengreek_tf.release import NOVEMBER_RELEASE
          from opengreek_tf.native_composer import read_native_records
          from opengreek_tf.jsonl_conservation import validate_native_jsonl_sources
          from opengreek_tf.record_stream import FieldArray, FieldObject
          from opengreek_tf.research_queries import search_native

          root = Path("new-source")
          selected = (
              "data/corpus/abas.fragmenta.jsonl",
              "data/corpus_secondary/nicomachus-mathematics.excerpta.jsonl",
              "data/corpus_secondary/scholia-in-aristophanem.triclinius-meters-dubner-1855.jsonl",
              "data/corpus_secondary/vitae-pindari-et-varia-de-pindaro.vita-metrica.jsonl",
              "data/corpus_secondary/cyrillus-theology.commentarii-in-joannem.reviewed-duplicate-witnesses.jsonl",
              "data/corpus_secondary/hesychius-lexicography.lexicon-o.missing-columns-witnesses.jsonl",
              "data/paratext/gutenberg/66595.jsonl",
              "data/paratext/gutenberg/32549.jsonl",
          )
          expected_rows = (1, 65, 3, 1, 8, 8, 9, 30)
          for relative, expected in zip(selected, expected_rows, strict=True):
              with (root / relative).open("rb") as handle:
                  assert sum(1 for _ in handle) == expected, relative
          output = Path("november-secondary-editorial-mixed-tf")
          command = [
              "opengreek-tf", "convert-texts", str(root),
              "--release", NOVEMBER_RELEASE.tag,
          ]
          for relative in selected:
              command.extend(["--file", relative])
          report = json.loads(subprocess.check_output([
              *command, "--output", str(output),
          ], text=True))
          assert report["revision"] == NOVEMBER_RELEASE.commit
          assert (report["primary_passages"], report["secondary_witnesses"],
                  report["paratext_records"]) == (1, 85, 39)
          assert report["records"] == 125
          independent = validate_native_jsonl_sources(
              root, selected, output, identity=NOVEMBER_RELEASE,
          )
          assert independent.records == 125
          assert independent.original_source_sha256 == report["original_source_sha256"]
          loaded = read_native_records(output)
          assert len(loaded) == 125
          assert [row.source_file for row in loaded[66:69]] == [selected[2]] * 3
          assert loaded[69].source_file == selected[3]
          hesychius = [row for row in loaded if row.source_file == selected[5]]
          assert len(hesychius) == 8
          for row in hesychius:
              page = row.fields.require("source_page")
              assert isinstance(page, FieldObject)
              region = page.require("region")
              assert isinstance(region, FieldArray)
              assert len(region.items) == 4
              assert all(type(value) is float for value in region.items)
          api = Fabric(locations=str(output), silent="deep").load(
              "fact_float", silent="deep",
          )
          assert api
          assert len(list(api.F.fact_float.items())) == 32
          assert not api.F.otype.s("word")
          hits = search_native(
              output, kind="secondary-witness",
              source_file=selected[5], max_results=20,
          )
          assert len(hits) == 8
          assert [(hit.locus, hit.text) for hit in hits] == [
              (row.fields.require("locus"), row.fields.require("text"))
              for row in hesychius
          ]
          print("NOVEMBER_SECONDARY_REAL_NATIVE_TF=" + json.dumps({
              "status": "PASS",
              "original_records": 125,
              "primary": 1,
              "secondary": 85,
              "paratext": 39,
              "source_float_atoms": 32,
              "independent_stock_jsonl_conservation": "PASS",
              "researcher_search_native": "PASS",
              "source_sha256": independent.original_source_sha256,
              "native_sha256": report["canonical_sha256"],
              "all_secondary_records_materialized": False,
          }, sort_keys=True))

      - name: Parse all November primary rows and conserve real editorial editions in TF
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          from opengreek_tf.record_stream import FieldArray, iter_family
          from opengreek_tf.release import NOVEMBER_RELEASE
          from opengreek_tf.native_composer import read_native_records
          from opengreek_tf.jsonl_conservation import validate_native_jsonl_sources

          root = Path("new-source")
          rows = token_rows = tokens = 0
          files = set()
          for row in iter_family(root, "primary", identity=NOVEMBER_RELEASE):
              rows += 1
              files.add(row.relative_file)
              value = row.fields.get("tokens")
              if isinstance(value, FieldArray):
                  token_rows += 1
                  tokens += len(value.items)
          assert (rows, len(files)) == (1913683, 3939)
          assert (token_rows, tokens) == (547, 3427)
          selected = (
              "data/corpus/anonymous.p-herc-1026.jsonl",
              "data/corpus/herodas.mimiambi.jsonl",
              "data/corpus/athenaeus-mechanics.de-machinis.jsonl",
          )
          destination = Path("real-november-primary-editorial-tf")
          command = ["opengreek-tf", "convert-texts", str(root),
                     "--release", NOVEMBER_RELEASE.tag]
          for file in selected:
              command.extend(["--file", file])
          report = json.loads(subprocess.check_output(
              [*command, "--output", str(destination)], text=True,
          ))
          assert report["primary_passages"] == 2473
          independent = validate_native_jsonl_sources(
              root, selected, destination, identity=NOVEMBER_RELEASE,
          )
          assert independent.records == 2473
          assert independent.original_source_sha256 == report["original_source_sha256"]
          recovered = read_native_records(destination)
          assert len(recovered) == 2473
          dclp = [row for row in recovered if row.source_file == selected[0]]
          assert len(dclp) == 89
          assert sum(row.fields.require("text") != row.fields.require("reading_text")
                     for row in dclp) == 86
          print("NOVEMBER_PRIMARY_REAL_TF=" + json.dumps({
              "parsed_original_primary_rows": rows,
              "parsed_original_primary_files": len(files),
              "original_token_rows": token_rows,
              "original_token_records": tokens,
              "native_editorial_rows": independent.records,
              "source_sha256": independent.original_source_sha256,
              "native_sha256": report["canonical_sha256"],
              "full_november_release": False,
          }, sort_keys=True))
