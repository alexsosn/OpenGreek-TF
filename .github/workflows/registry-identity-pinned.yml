name: Pinned native Open Greek identity-ledger atom proof

on:
  pull_request:
    paths:
      - "src/opengreek_tf/registry_probe.py"
      - "tests/test_registry_probe.py"
      - "docs/research/pinned-ledger-identity-atoms.md"
      - ".github/workflows/registry-identity-pinned.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Acquire exact immutable author and work ledgers
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init --quiet
          git -C upstream remote add origin https://github.com/open-greek/open-greek-corpus.git
          git -C upstream sparse-checkout init --no-cone
          cat > upstream/.git/info/sparse-checkout <<'EOF'
          /data/corpus_release.json
          /data/author_ids.json
          /data/work_ids.json
          EOF
          git -C upstream fetch --depth 1 --filter=blob:none origin \
            338aa27310b3cfe2588a993b4d113b503597d70f
          git -C upstream checkout --detach FETCH_HEAD
      - name: Load exact source records and reconstruct their native TF atoms
        shell: python
        run: |
          from pathlib import Path

          from tf.fabric import Fabric
          from opengreek_tf.registry_probe import (
              parse_ledger, write_registry_probe, read_registry_probe,
          )
          from opengreek_tf.source import verify_source

          root = Path("upstream")
          assert verify_source(root).revision == (
              "338aa27310b3cfe2588a993b4d113b503597d70f"
          )
          authors = parse_ledger(root, "author")
          works = parse_ledger(root, "work")
          assert len(authors) == 1516
          assert len(works) == 3944
          assert sum(row.status == "retired" for row in authors) == 16
          assert sum(row.status == "retired" for row in works) == 35
          assert sum(bool(row.former_slugs) for row in works) == 6

          author_ids = ("oga000001", "oga000330")
          work_ids = ("ogc000772", "ogc000839")
          selected = (
              *(row for row in authors if row.identifier in author_ids),
              *(row for row in works if row.identifier in work_ids),
          )
          assert len(selected) == 4
          alias = next(row for row in selected if row.identifier == "ogc000772")
          assert alias.former_slugs == ("choerilus.tituli-p-oxy-11-1399",)

          destination = Path("registry-ledger-tf")
          write_registry_probe(
              root, destination, authors=author_ids, works=work_ids,
          )
          recovered = read_registry_probe(destination)
          assert recovered == selected
          assert len(recovered) == 4
          assert not (destination / "form.tf").exists()

          api = Fabric(locations=str(destination), silent="deep").load(
              "atom_kind source_file source_record_id source_ordinal "
              "opaque_id registry_slug registry_status alias_value "
              "alias_position has_former_slug",
              silent="deep",
          )
          assert api
          assert len(api.F.otype.s("registryAuthor")) == 2
          assert len(api.F.otype.s("registryWork")) == 2
          assert len(api.F.otype.s("formerSlug")) == 1
          assert api.F.otype.s("word") == ()
          assert api.F.otype.s("passage") == ()
          assert len(api.F.otype.s("atom")) == 4
          print(
              "Real pinned identity ledgers: 1,516 author IDs and 3,944 work IDs; "
              "4 genuine source-record atoms, retired entities and ordered "
              "former slugs survive independent native TF load"
          )
