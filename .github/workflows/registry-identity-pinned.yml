name: Pinned native Open Greek identity-ledger atom proof

on:
  pull_request:
    paths:
      - "src/opengreek_tf/registry_probe.py"
      - "tests/test_registry_probe.py"
      - "docs/research/pinned-ledger-identity-atoms.md"
      - ".github/workflows/registry-identity-pinned.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Acquire exact immutable author and work ledgers
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init --quiet
          git -C upstream remote add origin https://github.com/open-greek/open-greek-corpus.git
          git -C upstream sparse-checkout init --no-cone
          cat > upstream/.git/info/sparse-checkout <<'EOF'
          /data/corpus_release.json
          /data/author_ids.json
          /data/work_ids.json
          EOF
          git -C upstream fetch --depth 1 --filter=blob:none origin \
            338aa27310b3cfe2588a993b4d113b503597d70f
          git -C upstream checkout --detach FETCH_HEAD
      - name: Materialize and independently validate all 5,460 pinned identity records
        shell: python
        run: |
          import json
          import time
          from dataclasses import asdict
          from pathlib import Path

          from tf.fabric import Fabric
          from opengreek_tf.registry_probe import parse_ledger
          from opengreek_tf.registry_snapshot import (
              write_full_registry_snapshot, validate_full_registry_snapshot,
          )
          from opengreek_tf.source import verify_source

          root = Path("upstream")
          assert verify_source(root).revision == (
              "338aa27310b3cfe2588a993b4d113b503597d70f"
          )
          authors = parse_ledger(root, "author")
          works = parse_ledger(root, "work")
          assert len(authors) == 1516
          assert len(works) == 3944
          assert sum(row.status == "retired" for row in authors) == 16
          assert sum(row.status == "retired" for row in works) == 35
          assert sum(bool(row.former_slugs) for row in works) == 6
          source_aliases = sum(len(row.former_slugs) for row in (*authors, *works))

          out = Path("full-identity-ledger-tf")
          started = time.perf_counter()
          report = write_full_registry_snapshot(root, out)
          built_seconds = time.perf_counter() - started
          started = time.perf_counter()
          assert validate_full_registry_snapshot(root, out) == report
          validated_seconds = time.perf_counter() - started
          assert asdict(report) == {
              "authors": 1516,
              "works": 3944,
              "retired_authors": 16,
              "retired_works": 35,
              "former_slug_facts": source_aliases,
              "source_atoms": 5460,
          }
          api = Fabric(locations=str(out), silent="deep").load(
              "atom_kind source_file source_record_id source_ordinal "
              "opaque_id registry_slug registry_status alias_value "
              "alias_position has_former_slug",
              silent="deep",
          )
          assert api
          assert len(api.F.otype.s("atom")) == 5460
          assert len(api.F.otype.s("registryAuthor")) == 1516
          assert len(api.F.otype.s("registryWork")) == 3944
          assert len(api.F.otype.s("formerSlug")) == source_aliases
          assert api.F.otype.s("word") == ()
          assert api.F.otype.s("passage") == ()
          assert not (out / "form.tf").exists()
          byte_size = sum(p.stat().st_size for p in out.glob("*.tf"))
          print(json.dumps({
              "full_source_ledger_validation": "PASS",
              **asdict(report),
              "build_plus_initial_validation_seconds": round(built_seconds, 3),
              "second_independent_validation_seconds": round(validated_seconds, 3),
              "native_tf_file_bytes": byte_size,
          }, sort_keys=True))
